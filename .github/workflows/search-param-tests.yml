# Exercises the module's SearchParameters against a Blaze FHIR server loaded
# with the MII test data (see search-param-test/README.md).
#
# The SearchParameter bundle is generated by SUSHI from the current FSH
# sources on every run — fsh-generated/ is not committed.

name: Search parameter tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with the build workflows — scripts/toolchain-pins.test.mjs
  # fails if this drifts.
  SUSHI_VERSION: "3.21.0"

jobs:
  search_param_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run SUSHI
        run: |
          npm install --global "fsh-sushi@${SUSHI_VERSION}"
          sushi .

      - name: Create Search Param Bundle
        run: .github/workflows/search-param-test/create-search-param-bundle.sh
      - name: Run Blaze
        run: docker compose -f .github/workflows/search-param-test/blaze.yml up -d
      - name: Wait for Blaze
        run: .github/workflows/search-param-test/wait-for-url.sh http://localhost:8080/health
      - name: Load Data
        run: .github/workflows/search-param-test/load-data.sh
      - name: Test Search
        run: .github/workflows/search-param-test/test-search.sh
