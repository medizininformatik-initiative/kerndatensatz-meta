name: CI DOTNET FHIR Validation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      SUSHI_VERSION:
        required: true
        type: string
    secrets:
      SIMPLIFIER_USERNAME:
        required: true
      SIMPLIFIER_PASSWORD:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Install the module's dependencies (from sushi-config.yaml) into the standard
      # FHIR package cache (~/.fhir/packages) and generate snapshots for every
      # StructureDefinition that ships without one. SUSHI (run by the Firely pipeline
      # below) requires snapshots on parent profiles and otherwise aborts with
      # "Structure Definition ... is missing a snapshot. Snapshot is required for import."
      #
      # Background: up to firely-terminal-pipeline v0.6.7 (Firely Terminal 3.3.2) the
      # pipeline's `fhir restore` inflated every dependency, which silently covered
      # packages without snapshots. Since the bump to v0.8.25 (Firely Terminal 3.5.0,
      # 2026-09-14) restore no longer inflates, so modules deriving from such packages
      # fail in SUSHI. Known case: de.gematik.isik ships 0 of 178 snapshots
      # (Kardiologie, Intensivmedizin derive from ISiK profiles).
      #
      # Packages that already carry snapshots are left untouched, so this step is a
      # no-op for every other module. Same tool gematik uses in the ISiK IG build.
      - name: Install dependencies and generate missing snapshots
        uses: Gefyra/fhir-pkg-tool@v0.5.0
        with:
          sushi-deps-file: sushi-config.yaml
          ignore-snapshot-errors: true

      - name: Firely.Terminal (GitHub Actions)
        id: firely-terminal
        uses: FirelyTeam/firely-terminal-pipeline@v0.8.25
        with:
          PATH_TO_CONFORMANCE_RESOURCES: fsh-generated/resources
          PATH_TO_EXAMPLES: fsh-generated/resources
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          DOTNET_VALIDATION_ENABLED: true
          JAVA_VALIDATION_ENABLED: false
          #JAVA_VALIDATION_OPTIONS: -advisor-file advisor.json -resolution-context file:fsh-generated/resources/ -show-message-ids
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          SUSHI_ENABLED: true 
          SUSHI_VERSION: ${{ inputs.SUSHI_VERSION }}
          #JAVA_VALIDATOR_VERSION: 6.10.4
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET #VALIDATION_CONFORMANCE_JAVA VALIDATION_EXAMPLES_JAVA
          #JAVA_SNAPSHOT_ENABLED: true

      - name: Add & Commit
        if: github.event_name == 'pull_request'
        uses: EndBug/add-and-commit@v9
        with:
          committer_name: GitHub Actions Bot
          committer_email: ActionBot@github.com
          add: 'fsh-generated/resources/'
          message: auto-generated FHIR files by GitHub Actions (CI FSH to FHIR)
